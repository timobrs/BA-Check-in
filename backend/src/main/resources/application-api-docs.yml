springdoc:
  api-docs:
    enabled: true
    path: /internal/openapi

  swagger-ui:
    enabled: true
    path: /internal/api-docs
    disable-swagger-default-url: true

  paths-to-match:
    - /api/v1/**

app:
  security:
    api-docs:
      username: ${API_DOCS_USERNAME}
      password: ${API_DOCS_PASSWORD}
